<!DOCTYPE html>
<html>
<head>
    <title>Fake Content System Engine</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

            /* 🌄 Background Image */
            background: url("https://images.unsplash.com/photo-1508780709619-79562169bc64") no-repeat center center/cover;

            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 🧊 Glass effect container */
        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            color: white;
            width: 400px;
        }

        h1 {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 80px;
            border-radius: 8px;
            border: none;
            padding: 10px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #00c853;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #009624;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Fake Content Detector</h1>

        <textarea id="inputText" placeholder="Enter content..."></textarea>

        <button onclick="checkContent()">Check</button>

        <div id="result"></div>
    </div>

    <script>
        function checkContent() {
            let text = document.getElementById("inputText").value;

            if (!text) {
                alert("Please enter text");
                return;
            }

            fetch("http://127.0.0.1:5000/check", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ text: text })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById("result").innerText = data.result;
            })
            .catch(err => {
                alert("Backend connection failed");
            });
        }
    </script>

</body>
</html>
